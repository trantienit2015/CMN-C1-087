[project]
name = "cmn-c1-087"
version = "1.0.0"
description = "CodebaseOnboardingSummaryAgent — AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
# framework.* / shared.* resolve via the CI include (scaffold) — no SDK dependency here.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no py.typed, so mypy resolves AgentBaseGraph/FunctionNode to
# Any. State that once here rather than scattering ignores on every node class.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Dependencies without type information. Remove and re-measure once the wheel ships py.typed.
module = ["framework.*", "shared.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
